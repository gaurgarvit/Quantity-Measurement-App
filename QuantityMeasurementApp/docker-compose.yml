version: '3.8'

services:
  quantity-measurement-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantity-measurement-app
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
