spring.application.name=QuantityMeasurementApp

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:quantitymeasurementdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Spring Data JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# H2 Console - http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:quantitymeasurementdb | User: sa | Password: (blank)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Debug Logging
logging.level.com.app.quantitymeasurement=DEBUG